# ==============================================================
# BN NEWS GUJARATI - NGINX PRODUCTION REVERSE PROXY CONFIGURATION
# Production Domains: bnnewsgujarati.com & www.bnnewsgujarati.com
# ==============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# -------------------------------------------------------------
# HTTP -> HTTPS Redirect
# -------------------------------------------------------------
server {
    listen 80;
    server_name bnnewsgujarati.com www.bnnewsgujarati.com bnnews.in www.bnnews.in admin.bnnews.in;
    return 301 https://$host$request_uri;
}

# -------------------------------------------------------------
# Main HTTPS Server (Frontend Next.js + Backend API + Uploads)
# -------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name bnnewsgujarati.com www.bnnewsgujarati.com bnnews.in www.bnnews.in admin.bnnews.in;

    ssl_certificate /etc/letsencrypt/live/bnnewsgujarati.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bnnewsgujarati.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Allow up to 50MB uploads for high resolution news images and videos
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # 1. Static uploads directory (Images, Thumbnails, Videos)
    location /uploads/ {
        alias /var/www/bn-news/backend/uploads/;
        # Fallback to backend port 5010 if not found via alias
        try_files $uri @backend_uploads;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location @backend_uploads {
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Auth rate limit
    location /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Backend REST API
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:5010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Next.js static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        access_log off;
    }

    # 5. Public Website & Admin Web App (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

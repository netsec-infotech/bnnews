# ==============================================================
# BN NEWS GUJARATI - NGINX PRODUCTION REVERSE PROXY CONFIGURATION
# ==============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# -------------------------------------------------------------
# 1. Backend REST API (api.bnnews.in)
# -------------------------------------------------------------
server {
    listen 80;
    server_name api.bnnews.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.bnnews.in;

    ssl_certificate /etc/letsencrypt/live/api.bnnews.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bnnews.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Static uploads directory
    location /uploads/ {
        alias /var/www/bn-news/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Auth rate limit
    location /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All API endpoints
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -------------------------------------------------------------
# 2. Public News Website & Admin Panel (www.bnnews.in / bnnews.in)
# -------------------------------------------------------------
server {
    listen 80;
    server_name bnnews.in www.bnnews.in admin.bnnews.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bnnews.in www.bnnews.in admin.bnnews.in;

    ssl_certificate /etc/letsencrypt/live/bnnews.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bnnews.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        access_log off;
    }

    # Next.js Application
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
